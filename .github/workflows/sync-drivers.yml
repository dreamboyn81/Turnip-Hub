name: Sync Drivers to Releases

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          SOURCES="DiskDVD:DiskDVD/TurniptoolsA8XX WinNative:WinNative-Emu/Drivers Vauzi:Vauzi-17/710 StevenMXZ:StevenMXZ/Adreno-Tools-Drivers whitebelyash:whitebelyash/AdrenoToolsDrivers Weab-chan:Weab-chan/freedreno_turnip-CI K11MCH1:K11MCH1/AdrenoToolsDrivers MrPurple666:MrPurple666/purple-turnip"

          for ITEM in $SOURCES; do
            PREFIX=$(echo "$ITEM" | cut -d: -f1)
            REPO=$(echo "$ITEM" | cut -d: -f2)

            echo "========================================"
            echo "Checking: $REPO (prefix: $PREFIX)"
            echo "========================================"

            RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest")

            if echo "$RELEASE_JSON" | jq -e '.message' > /dev/null 2>&1; then
              echo "Failed to get latest release for $REPO"
              continue
            fi

            UPSTREAM_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
            RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')
            RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body // empty')
            PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at // empty')

            # 格式化发布日期为 YYYY.MM.DD
            if [ -n "$PUBLISHED_AT" ] && [ "$PUBLISHED_AT" != "null" ]; then
              RELEASE_DATE=$(date -d "$PUBLISHED_AT" +%Y.%m.%d 2>/dev/null || echo "$PUBLISHED_AT" | cut -c1-10 | tr '-' '.')
            else
              RELEASE_DATE="未知"
              PUBLISHED_AT=""
            fi

            OUR_TAG="$PREFIX-$UPSTREAM_TAG"

            echo "Upstream Tag: $UPSTREAM_TAG"
            echo "Our Tag: $OUR_TAG"
            echo "Release Date: $RELEASE_DATE"
            echo "Published At: $PUBLISHED_AT"

            # ========== 始终清理该前缀的旧 Release，只留最新 ==========
            echo "Cleaning up old releases with prefix '$PREFIX-' (keep only $OUR_TAG)..."
            OLD_TAGS=$(gh release list --repo "$REPO_NAME" --limit 100 --json tagName \
              --jq ".[].tagName | select(startswith(\"$PREFIX-\"))")

            for OLD in $OLD_TAGS; do
              if [ "$OLD" != "$OUR_TAG" ]; then
                echo "Deleting old release + tag: $OLD"
                gh release delete "$OLD" --repo "$REPO_NAME" --yes --cleanup-tag || true
              fi
            done

            # 如果已经存在最新的，就跳过创建
            if gh release view "$OUR_TAG" --repo "$REPO_NAME" > /dev/null 2>&1; then
              echo "Already exists: $OUR_TAG, cleanup done, skipping create"
              continue
            fi

            echo "New version found, syncing..."

            TMP_DIR=$(mktemp -d)
            cd "$TMP_DIR"

            echo "$RELEASE_JSON" | jq -c '.assets[]?' | while read -r asset; do
              [ -z "$asset" ] && continue
              NAME=$(echo "$asset" | jq -r '.name')
              URL=$(echo "$asset" | jq -r '.browser_download_url')
              echo "Downloading: $NAME"
              curl -sL -H "Authorization: Bearer $GH_TOKEN" -o "$NAME" "$URL"
            done

            if [ -z "$(ls -A)" ]; then
              echo "No assets found, skipping"
              cd -
              rm -rf "$TMP_DIR"
              continue
            fi

            {
              echo "发布日期：$RELEASE_DATE"
              echo ""
              echo "$BODY"
              echo ""
              echo "来源: $RELEASE_URL"
            } > /tmp/release_notes.md

            # 先用 gh 创建 Release（带资产）
            gh release create "$OUR_TAG" \
              --repo "$REPO_NAME" \
              --title "$PREFIX - $RELEASE_NAME" \
              --notes-file /tmp/release_notes.md \
              $(ls -1)

            # 如果有真实发布时间，强制把 published_at 改成上游时间（实现按时间排序）
            if [ -n "$PUBLISHED_AT" ]; then
              echo "Updating published_at to $PUBLISHED_AT for correct sorting..."
              RELEASE_ID=$(gh api "repos/$REPO_NAME/releases/tags/$OUR_TAG" --jq '.id')
              curl -s -X PATCH \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO_NAME/releases/$RELEASE_ID" \
                -d "{\"published_at\":\"$PUBLISHED_AT\"}" > /dev/null
            fi

            echo "✅ Successfully published: $OUR_TAG"

            cd -
            rm -rf "$TMP_DIR"
          done
