name: Sync Drivers to Releases

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          SOURCES="DiskDVD:DiskDVD/TurniptoolsA8XX WinNative:WinNative-Emu/Drivers Vauzi:Vauzi-17/710 StevenMXZ:StevenMXZ/Adreno-Tools-Drivers whitebelyash:whitebelyash/AdrenoToolsDrivers MrPurple666:MrPurple666/purple-turnip"

          CANDIDATES_DIR=$(mktemp -d)
          echo "Candidates dir: $CANDIDATES_DIR"

          # ========== 第一阶段：收集需要同步的驱动 + 清理旧版本 ==========
          for ITEM in $SOURCES; do
            PREFIX=$(echo "$ITEM" | cut -d: -f1)
            REPO=$(echo "$ITEM" | cut -d: -f2)

            echo "========================================"
            echo "Checking: $REPO (prefix: $PREFIX)"
            echo "========================================"

            RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" || echo '{"message":"curl failed"}')

            if echo "$RELEASE_JSON" | jq -e '.message' > /dev/null 2>&1; then
              echo "Failed to get latest release for $REPO"
              continue
            fi

            UPSTREAM_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
            RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name // empty')
            RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url // empty')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body // empty')
            PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at // empty')

            if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
              echo "No valid tag, skipping $REPO"
              continue
            fi

            if [ -n "$PUBLISHED_AT" ] && [ "$PUBLISHED_AT" != "null" ]; then
              RELEASE_DATE=$(date -d "$PUBLISHED_AT" +%Y.%m.%d 2>/dev/null || echo "$PUBLISHED_AT" | cut -c1-10 | tr '-' '.')
              SORT_KEY=$(echo "$PUBLISHED_AT" | cut -c1-19 | tr 'T:' '--')
            else
              RELEASE_DATE="未知"
              PUBLISHED_AT=""
              SORT_KEY="0000-00-00T00-00-00"
            fi

            OUR_TAG="$PREFIX-$UPSTREAM_TAG"

            echo "Upstream Tag: $UPSTREAM_TAG"
            echo "Our Tag: $OUR_TAG"
            echo "Release Date: $RELEASE_DATE"

            # 始终清理该前缀的旧 Release
            echo "Cleaning up old releases with prefix '$PREFIX-' (keep only $OUR_TAG)..."
            OLD_TAGS=$(gh release list --repo "$REPO_NAME" --limit 100 --json tagName \
              --jq ".[].tagName | select(startswith(\"$PREFIX-\"))" 2>/dev/null || true)

            for OLD in $OLD_TAGS; do
              if [ -n "$OLD" ] && [ "$OLD" != "$OUR_TAG" ]; then
                echo "Deleting old release + tag: $OLD"
                gh release delete "$OLD" --repo "$REPO_NAME" --yes --cleanup-tag 2>/dev/null || true
              fi
            done

            # 已存在就跳过
            if gh release view "$OUR_TAG" --repo "$REPO_NAME" > /dev/null 2>&1; then
              echo "Already exists: $OUR_TAG, cleanup done, skipping"
              continue
            fi

            # 保存候选
            CAND_FILE="$CANDIDATES_DIR/${SORT_KEY}_${PREFIX}.json"
            echo "$RELEASE_JSON" > "$CAND_FILE"
            echo "Queued for create: $OUR_TAG  (sort key: $SORT_KEY)"
          done

          # ========== 第二阶段：按真实发布时间从旧到新创建 ==========
          mapfile -t CAND_FILES < <(find "$CANDIDATES_DIR" -maxdepth 1 -name '*.json' -type f | sort)

          CAND_COUNT=${#CAND_FILES[@]}
          echo ""
          echo "Total candidates to create: $CAND_COUNT"

          if [ "$CAND_COUNT" -eq 0 ]; then
            echo "Nothing new to create."
            rm -rf "$CANDIDATES_DIR"
            exit 0
          fi

          INDEX=0
          TOTAL=$CAND_COUNT

          for CAND_FILE in "${CAND_FILES[@]}"; do
            INDEX=$((INDEX + 1))
            RELEASE_JSON=$(cat "$CAND_FILE")

            PREFIX=$(basename "$CAND_FILE" | sed 's/.*_//;s/\.json//')
            UPSTREAM_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
            RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name // empty')
            RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url // empty')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body // empty')
            PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at // empty')

            if [ -z "$UPSTREAM_TAG" ]; then
              echo "Invalid candidate, skipping"
              continue
            fi

            if [ -n "$PUBLISHED_AT" ] && [ "$PUBLISHED_AT" != "null" ]; then
              RELEASE_DATE=$(date -d "$PUBLISHED_AT" +%Y.%m.%d 2>/dev/null || echo "$PUBLISHED_AT" | cut -c1-10 | tr '-' '.')
            else
              RELEASE_DATE="未知"
              PUBLISHED_AT=""
            fi

            OUR_TAG="$PREFIX-$UPSTREAM_TAG"

            echo ""
            echo "----------------------------------------"
            echo "[$INDEX/$TOTAL] Creating: $OUR_TAG  (发布日期: $RELEASE_DATE)"
            echo "----------------------------------------"

            TMP_DIR=$(mktemp -d)
            cd "$TMP_DIR"

            # 下载资产
            echo "$RELEASE_JSON" | jq -c '.assets[]?' 2>/dev/null | while read -r asset; do
              [ -z "$asset" ] && continue
              NAME=$(echo "$asset" | jq -r '.name // empty')
              URL=$(echo "$asset" | jq -r '.browser_download_url // empty')
              if [ -n "$NAME" ] && [ -n "$URL" ]; then
                echo "Downloading: $NAME"
                curl -sL -H "Authorization: Bearer $GH_TOKEN" -o "$NAME" "$URL" || echo "Failed to download $NAME"
              fi
            done

            if [ -z "$(ls -A 2>/dev/null)" ]; then
              echo "No assets found, skipping"
              cd - >/dev/null
              rm -rf "$TMP_DIR"
              continue
            fi

            {
              echo "发布日期：$RELEASE_DATE"
              echo ""
              echo "$BODY"
              echo ""
              echo "来源: $RELEASE_URL"
            } > /tmp/release_notes.md

            # 只有最后一个（真正最新的）才标记为 Latest
            if [ "$INDEX" -eq "$TOTAL" ]; then
              LATEST_FLAG="--latest=true"
              echo ">>> This is the newest one, marking as Latest"
            else
              LATEST_FLAG="--latest=false"
            fi

            gh release create "$OUR_TAG" \
              --repo "$REPO_NAME" \
              --title "$PREFIX - $RELEASE_NAME" \
              --notes-file /tmp/release_notes.md \
              $LATEST_FLAG \
              $(ls -1) || {
                echo "Failed to create release $OUR_TAG"
                cd - >/dev/null
                rm -rf "$TMP_DIR"
                continue
              }

            # 写入真实 published_at
            if [ -n "$PUBLISHED_AT" ]; then
              echo "Updating published_at to $PUBLISHED_AT..."
              RELEASE_ID=$(gh api "repos/$REPO_NAME/releases/tags/$OUR_TAG" --jq '.id' 2>/dev/null || true)
              if [ -n "$RELEASE_ID" ]; then
                curl -s -X PATCH \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO_NAME/releases/$RELEASE_ID" \
                  -d "{\"published_at\":\"$PUBLISHED_AT\"}" > /dev/null || true
              fi
            fi

            echo "✅ Successfully published: $OUR_TAG"

            cd - >/dev/null
            rm -rf "$TMP_DIR"
          done

          rm -rf "$CANDIDATES_DIR"
          echo ""
          echo "All done. Releases should now be sorted by real publish date (newest on top)."
