name: Sync Drivers to Releases

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          declare -A SOURCES=(
            ["DiskDVD"]="DiskDVD/TurniptoolsA8XX"
            ["WinNative"]="WinNative-Emu/Drivers"
            ["Vauzi"]="Vauzi-17/710"
          )

          for PREFIX in "${!SOURCES[@]}"; do
            REPO="${SOURCES[$PREFIX]}"
            echo "========================================"
            echo "Checking: $REPO"
            echo "========================================"

            RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest")

            if echo "$RELEASE_JSON" | jq -e '.message' > /dev/null 2>&1; then
              echo "Failed to get latest release for $REPO"
              continue
            fi

            UPSTREAM_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
            RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')
            RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body // empty')
            PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at')

            OUR_TAG="\( {PREFIX}- \){UPSTREAM_TAG}"

            echo "Upstream Tag: $UPSTREAM_TAG"
            echo "Our Tag: $OUR_TAG"

            if gh release view "$OUR_TAG" --repo "$REPO_NAME" > /dev/null 2>&1; then
              echo "Already exists: $OUR_TAG, skipping"
              continue
            fi

            echo "New version found, syncing..."

            TMP_DIR=$(mktemp -d)
            cd "$TMP_DIR"

            echo "$RELEASE_JSON" | jq -c '.assets[]?' | while read -r asset; do
              [ -z "$asset" ] && continue
              NAME=$(echo "$asset" | jq -r '.name')
              URL=$(echo "$asset" | jq -r '.browser_download_url')
              echo "Downloading: $NAME"
              curl -sL -H "Authorization: Bearer $GH_TOKEN" -o "$NAME" "$URL"
            done

            if [ -z "$(ls -A)" ]; then
              echo "No assets found, skipping"
              cd -
              rm -rf "$TMP_DIR"
              continue
            fi

            {
              echo "## Source"
              echo ""
              echo "- **Upstream Repo**: [$REPO](https://github.com/$REPO)"
              echo "- **Original Release**: [$RELEASE_NAME]($RELEASE_URL)"
              echo "- **Upstream Tag**: \`$UPSTREAM_TAG\`"
              echo "- **Published**: $PUBLISHED_AT"
              echo ""
              echo "---"
              echo ""
              echo "## Original Notes"
              echo ""
              echo "$BODY"
              echo ""
              echo "---"
              echo ""
              echo "> Mirrored by Turnip-Hub for emulator convenience. Copyright belongs to the original authors."
            } > release_notes.md

            gh release create "$OUR_TAG" \
              --repo "$REPO_NAME" \
              --title "$PREFIX - $RELEASE_NAME" \
              --notes-file release_notes.md \
              ./*

            echo "Successfully published: $OUR_TAG"

            cd -
            rm -rf "$TMP_DIR"
          done
